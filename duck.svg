<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="800" height="160">
  <!-- ground -->
  <line x1="0" y1="141" x2="800" y2="141" stroke="#8b949e" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <g stroke="#3fb950" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <path d="M120,141 l-3,-8 M124,141 l0,-10 M128,141 l3,-7"/>
    <path d="M560,141 l-3,-7 M564,141 l0,-9 M568,141 l3,-8"/>
    <path d="M690,141 l-2,-6 M694,141 l2,-8"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" dur="11s" repeatCount="indefinite"
      values="-80,140; 400,140; 400,140; 880,140" keyTimes="0; 0.3636; 0.6364; 1"/>

    <!-- walking legs -->
    <g stroke="#ff9f1c" stroke-width="4" stroke-linecap="round" fill="#ff9f1c">
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite" calcMode="discrete"
        values="1;0;1" keyTimes="0;0.3636;0.6364"/>
      <g>
        <line x1="-6" y1="-18" x2="-6" y2="-2"/><ellipse cx="-2" cy="-1" rx="7" ry="2.5" stroke="none"/>
        <animateTransform attributeName="transform" type="rotate" values="-22 -6 -18;22 -6 -18;-22 -6 -18" dur="0.5s" repeatCount="indefinite"/>
      </g>
      <g>
        <line x1="6" y1="-18" x2="6" y2="-2"/><ellipse cx="10" cy="-1" rx="7" ry="2.5" stroke="none"/>
        <animateTransform attributeName="transform" type="rotate" values="22 6 -18;-22 6 -18;22 6 -18" dur="0.5s" repeatCount="indefinite"/>
      </g>
    </g>
    <!-- standing legs -->
    <g stroke="#ff9f1c" stroke-width="4" stroke-linecap="round" fill="#ff9f1c" opacity="0">
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite" calcMode="discrete"
        values="0;1;0" keyTimes="0;0.3636;0.6364"/>
      <line x1="-6" y1="-18" x2="-6" y2="-2"/><ellipse cx="-6" cy="-1" rx="7" ry="2.5" stroke="none"/>
      <line x1="6" y1="-18" x2="6" y2="-2"/><ellipse cx="6" cy="-1" rx="7" ry="2.5" stroke="none"/>
    </g>

    <!-- body -->
    <path d="M-26,-44 L-44,-58 L-36,-34 Z" fill="#ffd54a"/>
    <ellipse cx="0" cy="-38" rx="30" ry="22" fill="#ffd54a"/>
    <ellipse cx="-5" cy="-37" rx="15" ry="10" fill="#f5c02f">
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite" calcMode="discrete"
        values="1;0;1" keyTimes="0;0.42;0.59"/>
    </ellipse>

    <!-- head, side view -->
    <g>
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite" calcMode="discrete"
        values="1;0;1" keyTimes="0;0.39;0.61"/>
      <circle cx="20" cy="-70" r="16" fill="#ffd54a"/>
      <path d="M33,-72 Q46,-70 48,-66 Q44,-61 33,-63 Z" fill="#ff9f1c"/>
      <circle cx="25" cy="-74" r="2.8" fill="#1f2328"/>
      <circle cx="26" cy="-75" r="0.9" fill="#fff"/>
    </g>

    <!-- head, looking at you -->
    <g opacity="0">
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite" calcMode="discrete"
        values="0;1;0" keyTimes="0;0.39;0.61"/>
      <circle cx="14" cy="-70" r="16" fill="#ffd54a"/>
      <circle cx="3" cy="-65" r="3.5" fill="#ff8fa3" opacity="0.6"/>
      <circle cx="25" cy="-65" r="3.5" fill="#ff8fa3" opacity="0.6"/>
      <circle cx="8" cy="-73" r="2.8" fill="#1f2328"/>
      <circle cx="20" cy="-73" r="2.8" fill="#1f2328"/>
      <circle cx="9" cy="-74" r="0.9" fill="#fff"/>
      <circle cx="21" cy="-74" r="0.9" fill="#fff"/>
      <ellipse cx="14" cy="-64" rx="7" ry="3.5" fill="#ff9f1c"/>
      <!-- blink -->
      <rect x="4" y="-77" width="20" height="0" fill="#ffd54a">
        <animate attributeName="height" dur="11s" repeatCount="indefinite"
          values="0;0;8;0;0" keyTimes="0;0.5;0.51;0.52;1"/>
      </rect>
    </g>

    <!-- wing wave -->
    <g opacity="0">
      <animate attributeName="opacity" dur="11s" repeatCount="indefinite" calcMode="discrete"
        values="0;1;0" keyTimes="0;0.42;0.59"/>
      <g>
        <ellipse cx="-28" cy="-48" rx="16" ry="6.5" fill="#f5c02f"/>
        <animateTransform attributeName="transform" type="rotate" values="15 -12 -48;75 -12 -48;15 -12 -48" dur="0.45s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>
</svg>
