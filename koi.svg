<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f3d4a"/>
      <stop offset="1" stop-color="#0a2a33"/>
    </linearGradient>
    <radialGradient id="light" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="pond"><rect width="800" height="220" rx="18"/></clipPath>

    <g id="koiA">
      <g>
        <path d="M-36,0 C-46,-9 -58,-15 -64,-13 C-57,-5 -57,5 -64,13 C-58,15 -46,9 -36,0Z" fill="#f28c38" opacity="0.85"/>
        <animateTransform attributeName="transform" type="rotate" values="-14 -36 0;14 -36 0;-14 -36 0" dur="0.9s" repeatCount="indefinite"/>
      </g>
      <ellipse cx="10" cy="-12" rx="9" ry="4" transform="rotate(-35 10 -12)" fill="#f7f1e8" opacity="0.7"/>
      <ellipse cx="10" cy="12" rx="9" ry="4" transform="rotate(35 10 12)" fill="#f7f1e8" opacity="0.7"/>
      <path d="M38,0 C32,-12 8,-14 -14,-9 C-26,-6 -33,-3 -38,0 C-33,3 -26,6 -14,9 C8,14 32,12 38,0Z" fill="#f7f1e8"/>
      <path d="M30,-6 C24,-11 14,-10 12,-4 C14,2 24,3 30,-1Z" fill="#e8552d"/>
      <path d="M2,-9 C-8,-10 -16,-6 -14,0 C-10,4 -2,2 4,-3Z" fill="#f28c38"/>
      <path d="M-16,3 C-22,4 -28,2 -30,0 C-26,-2 -20,-2 -16,3Z" fill="#e8552d"/>
    </g>

    <g id="koiB">
      <g>
        <path d="M-36,0 C-46,-9 -58,-15 -64,-13 C-57,-5 -57,5 -64,13 C-58,15 -46,9 -36,0Z" fill="#f7f1e8" opacity="0.8"/>
        <animateTransform attributeName="transform" type="rotate" values="12 -36 0;-12 -36 0;12 -36 0" dur="1.1s" repeatCount="indefinite"/>
      </g>
      <ellipse cx="10" cy="-12" rx="9" ry="4" transform="rotate(-35 10 -12)" fill="#f28c38" opacity="0.6"/>
      <ellipse cx="10" cy="12" rx="9" ry="4" transform="rotate(35 10 12)" fill="#f28c38" opacity="0.6"/>
      <path d="M38,0 C32,-12 8,-14 -14,-9 C-26,-6 -33,-3 -38,0 C-33,3 -26,6 -14,9 C8,14 32,12 38,0Z" fill="#f28c38"/>
      <path d="M24,-8 C14,-10 6,-6 8,0 C12,4 22,2 26,-3Z" fill="#1f1f1f" opacity="0.85"/>
      <path d="M-4,4 C-12,6 -20,4 -22,1 C-16,-2 -8,-1 -4,4Z" fill="#f7f1e8"/>
    </g>
  </defs>

  <g clip-path="url(#pond)">
    <rect width="800" height="220" fill="url(#water)"/>
    <ellipse cx="220" cy="70" rx="180" ry="60" fill="url(#light)">
      <animate attributeName="cx" values="220;300;220" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="600" cy="160" rx="160" ry="50" fill="url(#light)">
      <animate attributeName="cx" values="600;520;600" dur="17s" repeatCount="indefinite"/>
    </ellipse>

    <use href="#koiA">
      <animateMotion dur="20s" repeatCount="indefinite" rotate="auto"
        path="M400,45 C640,45 745,80 745,110 C745,140 640,175 400,175 C160,175 55,140 55,110 C55,80 160,45 400,45Z"/>
    </use>
    <use href="#koiB">
      <animateMotion dur="26s" begin="-8s" repeatCount="indefinite" rotate="auto"
        path="M120,150 C260,40 380,40 450,110 C520,180 640,180 700,110 C760,40 640,30 520,60 C400,90 300,200 120,150Z"/>
    </use>

    <g fill="none" stroke="#bfe6ee" stroke-width="1.2">
      <circle cx="150" cy="60" r="0" opacity="0">
        <animate attributeName="r" values="0;28" dur="4s" begin="0s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0" dur="4s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="560" cy="45" r="0" opacity="0">
        <animate attributeName="r" values="0;24" dur="5s" begin="1.7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0" dur="5s" begin="1.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="420" cy="185" r="0" opacity="0">
        <animate attributeName="r" values="0;30" dur="4.5s" begin="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0" dur="4.5s" begin="3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g opacity="0.9">
      <path d="M690,40 m-22,0 a22,18 0 1,0 44,0 a22,18 0 1,0 -44,0 M690,40 L712,34 L712,44Z" fill="#3f7d4e" fill-rule="evenodd"/>
      <path d="M90,185 m-18,0 a18,14 0 1,0 36,0 a18,14 0 1,0 -36,0 M90,185 L72,180 L72,190Z" fill="#4b8f5a" fill-rule="evenodd"/>
      <circle cx="684" cy="37" r="5" fill="#f4b8c8"/>
    </g>
  </g>
</svg>
